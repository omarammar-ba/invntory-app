      :root { color-scheme: light; }
      html.dark { color-scheme: dark; }
      html {
        width: 100%;
        min-height: 100%;
        background: #f4f7fb;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      html.dark { background: #121212; }
      html.app-launching {
        background: #3730a3;
      }
      body {
        width: 100%;
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        background: #f4f7fb;
        color: #1e293b;
        font-family: "Cairo", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      html.dark body { background: #121212; color: #e6e6e6; }
      html.app-launching body { background: #3730a3; }
      #root {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
      }

      #app-launch-splash {
        position: fixed;
        inset: 0;
        box-sizing: border-box;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
        min-height: 100dvh;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background:
          radial-gradient(circle at 82% 12%, rgba(96, 165, 250, 0.22), transparent 34%),
          linear-gradient(145deg, #0f172a 0%, #172554 46%, #3730a3 84%, #3730a3 100%);
        color: #fff;
        opacity: 1;
        visibility: visible;
        transition: opacity 280ms ease, visibility 280ms ease;
      }
      #app-launch-splash::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: max(18%, calc(env(safe-area-inset-bottom) + 96px));
        background: linear-gradient(
          to bottom,
          rgba(55,48,163,0) 0%,
          rgba(55,48,163,0.86) 52%,
          #3730a3 76%,
          #3730a3 100%
        );
        pointer-events: none;
        z-index: 0;
      }
      #app-launch-splash.app-launch-splash--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .app-launch-splash__content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .app-launch-splash__logo-shell {
        display: grid;
        place-items: center;
        width: 104px;
        height: 104px;
        margin-bottom: 20px;
        border: 1px solid rgba(255,255,255,0.20);
        border-radius: 30px;
        background: rgba(255,255,255,0.10);
        box-shadow: 0 24px 60px rgba(0,0,0,0.24);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }
      .app-launch-splash__logo {
        width: 84px;
        height: 84px;
        border-radius: 23px;
        box-shadow: 0 14px 30px rgba(0,0,0,0.20);
      }
      .app-launch-splash__title {
        margin: 0;
        font-size: 27px;
        font-weight: 900;
        line-height: 1.25;
        letter-spacing: -0.03em;
      }
      .app-launch-splash__subtitle {
        margin: 7px 0 0;
        color: rgba(219,234,254,0.78);
        font-size: 12px;
        font-weight: 700;
      }
      .app-launch-splash__glyphs {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 28px;
      }
      .app-launch-splash__glyph {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border: 1px solid rgba(255,255,255,0.13);
        border-radius: 11px;
        background: rgba(255,255,255,0.08);
        color: rgba(255,255,255,0.60);
        animation: app-launch-glyph 1.25s ease-in-out infinite;
      }
      .app-launch-splash__glyph:nth-child(2) { animation-delay: 140ms; }
      .app-launch-splash__glyph:nth-child(3) { animation-delay: 280ms; }

      .app-launch-splash__credit {
        position: absolute;
        z-index: 1;
        left: 50%;
        bottom: max(26px, calc(env(safe-area-inset-bottom) + 14px));
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
        color: rgba(241,245,249,0.82);
        font-size: 10.5px;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
      }
      .app-launch-splash__credit-logo {
        display: block;
        width: 138px;
        height: auto;
        opacity: 1;
        filter: brightness(1.8) contrast(0.9) saturate(1.05) drop-shadow(0 5px 12px rgba(0,0,0,0.22));
      }
      @media (max-height: 650px) {
        .app-launch-splash__credit {
          bottom: max(16px, calc(env(safe-area-inset-bottom) + 8px));
        }
        .app-launch-splash__credit-logo { width: 122px; }
      }

      @keyframes app-launch-glyph {
        0%, 100% { opacity: 0.38; transform: translateY(0) scale(0.96); }
        50% { opacity: 0.90; transform: translateY(-2px) scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-launch-splash { transition: none; }
        .app-launch-splash__glyph { animation: none; opacity: 0.70; }
      }

      .print-only-header { display: none !important; }

      @media print {
        #app-launch-splash { display: none !important; }
        @page { size: A4 portrait; margin: 0.5cm; }
        .print-only-header {

  void (async () => {

    const own = registrations.filter(registration => {
      const script = registration.active?.scriptURL || registration.waiting?.scriptURL || registration.installing?.scriptURL;
      return script && new URL(script).origin === location.origin && new URL(script).pathname === '/sw.js';
    });
    const controlled = own.some(registration => registration.active?.scriptURL === navigator.serviceWorker.controller?.scriptURL);
    await Promise.all(own.map(registration => registration.unregister()));

      const names = await caches.keys();
      await Promise.all(names.filter(name => name.startsWith('inventory-app-')).map(name => caches.delete(name)));

    if (controlled) location.reload();
  })().catch(error => console.warn('Development cache cleanup failed:', error));
